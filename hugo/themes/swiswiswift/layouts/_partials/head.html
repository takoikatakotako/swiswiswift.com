<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>
{{ $description := .Description | default (.Summary | plainify) | default site.Title }}
<meta name="description" content="{{ $description }}">

<!-- リセットCSS -->
<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

<!-- ファビコン -->
<link rel="icon" type="image/png" href="/image/favicon.png">

<!-- Googleフォント -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@100..900&display=swap" rel="stylesheet">

<!-- css/style.css -->
{{ partialCached "head/css.html" . }}

{{ if and hugo.IsProduction (not hugo.IsServer) }}
  {{ partial "google_analytics.html" . }}
{{ end }}
