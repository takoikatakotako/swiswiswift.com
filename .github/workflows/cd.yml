name: Upload to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET_URL: s3://swiswiswift.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::071766756112:role/swiswiswift-github-actions
          aws-region: ap-northeast-1
      - name: Install Hugo
        run: |
          HUGO_VERSION="$(cat .hugo-version)"
          HUGO_PACKAGE="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          HUGO_RELEASE_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --silent --show-error "${HUGO_RELEASE_URL}/${HUGO_PACKAGE}" -o "${HUGO_PACKAGE}"
          curl --fail --location --silent --show-error "${HUGO_RELEASE_URL}/hugo_${HUGO_VERSION}_checksums.txt" -o hugo_checksums.txt
          awk -v package="${HUGO_PACKAGE}" '$2 == package { print }' hugo_checksums.txt > hugo_package_checksum.txt
          sha256sum --check hugo_package_checksum.txt
          sudo dpkg -i "${HUGO_PACKAGE}"
          hugo version
      - name: Build Files
        run: make build
      - name: Upload to S3
        run: |
          aws s3 sync ./hugo/public $S3_BUCKET_URL --exact-timestamps --delete
