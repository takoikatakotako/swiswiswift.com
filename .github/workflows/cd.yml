name: Deploy blog

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: swiswiswift-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S3_BUCKET_URL: s3://swiswiswift-content-579039992557
      CLOUDFRONT_DISTRIBUTION_ID: E166LFVQ8I6UII
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Hugo
        run: |
          HUGO_VERSION="$(cat .hugo-version)"
          HUGO_PACKAGE="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          HUGO_RELEASE_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --silent --show-error "${HUGO_RELEASE_URL}/${HUGO_PACKAGE}" -o "${HUGO_PACKAGE}"
          curl --fail --location --silent --show-error "${HUGO_RELEASE_URL}/hugo_${HUGO_VERSION}_checksums.txt" -o hugo_checksums.txt
          awk -v package="${HUGO_PACKAGE}" '$2 == package { print }' hugo_checksums.txt > hugo_package_checksum.txt
          sha256sum --check hugo_package_checksum.txt
          sudo dpkg -i "${HUGO_PACKAGE}"
          hugo version
      - name: Build Files
        run: make build
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::579039992557:role/swiswiswift-github-actions
          allowed-account-ids: '579039992557'
          aws-region: ap-northeast-1
      - name: Upload to S3
        run: |
          aws s3 sync ./hugo/public "$S3_BUCKET_URL" --exact-timestamps --delete
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'
